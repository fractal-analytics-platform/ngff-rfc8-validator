[project]
site_name = "NGFF RFC-8 validator"
site_url = "https://fractal-analytics-platform.github.io/ngff-rfc8-validator"
repo_url = "https://github.com/fractal-analytics-platform/ngff-rfc8-validator"
repo_name = "fractal-analytics-platform/ngff-rfc8-validator"
extra_css = ["extra.css"]
copyright = """
Copyright 2026 (C) BioVisionCenter (University of Zurich) - see
<u><a href="https://github.com/fractal-analytics-platform/ngff-rfc8-validator/blob/main/LICENSE">LICENSE</a></u>.
"""

nav = [
    { "Home" = "index.md" },
    { "Python reference" = "autoapi/" },
]

[project.theme]
variant = "classic"
language = "en"
logo = "https://raw.githubusercontent.com/fractal-analytics-platform/fractal-logos/refs/heads/main/common/fractal_logo.png"
favicon = "https://raw.githubusercontent.com/fractal-analytics-platform/fractal-logos/refs/heads/main/common/fractal_favicon.png"
custom_dir = "docs/overrides"
navigation = {"expand" = true}

features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "search.highlight",
    "toc.follow",
    "toc.integrate",
]


[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "material/weather-night"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to light mode"

[project.plugins.search]
[project.plugins.section-index]

[project.plugins.mkdocs-autoapi]
autoapi_dir = "python/src/"

[project.plugins.mkdocstrings.handlers.python]
paths = "python/src"
inventories = [
    "https://docs.python.org/3/objects.inv",
    "https://referencing.readthedocs.io/en/stable/objects.inv",
    "https://python-jsonschema.readthedocs.io/en/stable/objects.inv",
]

[project.plugins.mkdocstrings.handlers.python.options]
backlinks = "tree"
docstring_style = "google"
docstring_section_style = "table"
show_source = true
allow_inspection = true
show_symbol_type_heading = true
show_symbol_type_toc = false
signature_crossrefs = true
unwrap_annotated = true
show_attribute_values = true
inherited_members = true
